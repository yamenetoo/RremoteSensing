[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usgs-splib07"
version = "2.1.0"
description = "Download the USGS Spectral Library v7, build a clean spectral library, and preprocess spectra into features (resampling, sensor convolution, derivatives, continuum removal, SAM matching)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.5",
    "requests>=2.28",
]

[project.optional-dependencies]
progress = ["tqdm"]
plot = ["matplotlib"]
geo = ["rasterio"]
dev = ["pytest", "tqdm", "matplotlib", "rasterio"]

[project.scripts]
splib07 = "usgs_splib07.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
